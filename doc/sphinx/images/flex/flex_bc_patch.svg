<text x="490.0" y="92.0" font-size="12" font-weight="normal" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="490.0" dy="0">No bearing surface: a frame inside the</tspan><tspan x="490.0" dy="1.35em">material is made a node of the mesh and</tspan><tspan x="490.0" dy="1.35em">tied to the nodes of the elements that</tspan><tspan x="490.0" dy="1.35em">meet there; any other frame to the nodes</tspan><tspan x="490.0" dy="1.35em">within radius. So is a revolute or</tspan><tspan x="490.0" dy="1.35em">spherical frame with no matching face.</tspan><tspan x="490.0" dy="1.35em">A float joint passes nothing, but its</tspan><tspan x="490.0" dy="1.35em">frame moves with the deformed body.</tspan></text>
