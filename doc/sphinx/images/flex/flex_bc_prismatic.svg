<text x="40.0" y="300.0" font-size="12" font-weight="normal" fill="#5f6670" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="40.0" dy="0">the bore in section: its wall cut into stations, each tied to a point on the</tspan><tspan x="40.0" dy="1.35em">axis; the stations' motion is interpolated by a cubic spline (dotted)</tspan></text>
<text x="505.0" y="60.0" font-size="14" font-weight="bold" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="505.0" dy="0">Prismatic joint</tspan></text>
<text x="505.0" y="82.0" font-size="12" font-weight="normal" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="505.0" dy="0">The body holding the bore gets a</tspan><tspan x="505.0" dy="1.35em">sliding attachment: rays from the</tspan><tspan x="505.0" dy="1.35em">frame find the wall, which is cut into</tspan><tspan x="505.0" dy="1.35em">stations (RBE3, six static modes</tspan><tspan x="505.0" dy="1.35em">each). The child moves with the mean</tspan><tspan x="505.0" dy="1.35em">motion of the wall under its bearing,</tspan><tspan x="505.0" dy="1.35em">wherever it is along the bore.</tspan></text>
</svg>
