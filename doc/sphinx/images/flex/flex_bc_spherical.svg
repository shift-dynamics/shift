<text x="490.0" y="92.0" font-size="12" font-weight="normal" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="490.0" dy="0">Tied: the nodes on the spherical faces</tspan><tspan x="490.0" dy="1.35em">centred on the frame, a socket before a</tspan><tspan x="490.0" dy="1.35em">ball, those of the smallest radius.</tspan><tspan x="490.0" dy="1.35em">The joint passes three forces; the body</tspan><tspan x="490.0" dy="1.35em">turns freely about the centre. The</tspan><tspan x="490.0" dy="1.35em">attachment still has six static modes;</tspan><tspan x="490.0" dy="1.35em">the joint loads only its translations.</tspan></text>
