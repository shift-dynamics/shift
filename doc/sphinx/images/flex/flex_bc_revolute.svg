<text x="490.0" y="70.0" font-size="14" font-weight="bold" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="490.0" dy="0">Revolute joint</tspan></text>
<text x="490.0" y="92.0" font-size="12" font-weight="normal" fill="#1d2125" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="490.0" dy="0">Tied: the nodes on the cylindrical faces</tspan><tspan x="490.0" dy="1.35em">coaxial with the joint axis, bores before</tspan><tspan x="490.0" dy="1.35em">pins, those of the smallest radius, all</tspan><tspan x="490.0" dy="1.35em">of them.</tspan><tspan x="490.0" dy="1.35em">The frame moves with their mean motion</tspan><tspan x="490.0" dy="1.35em">(RBE3). The joint passes three forces and</tspan><tspan x="490.0" dy="1.35em">two moments into the body; the rotation</tspan><tspan x="490.0" dy="1.35em">about its axis is free.</tspan></text>
