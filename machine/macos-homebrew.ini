# meson native file for macOS with Homebrew on Apple Silicon:
#   meson setup build --native-file machine/macos-homebrew.ini
# On an Intel Mac, set brew to '/usr/local' and cpu to 'native'.

[constants]
brew = '/opt/homebrew'

[built-in options]
# lapack (cblas, lapacke) is keg-only, so it is not on pkg-config's default path
pkg_config_path = [brew / 'opt/lapack/lib/pkgconfig']
# Apple clang has no OpenMP runtime of its own; libomp is keg-only too
cpp_args = ['-I' + brew / 'opt/libomp/include']
cpp_link_args = ['-L' + brew / 'opt/libomp/lib']

[project options]
cpu = 'apple-m1'
# feenableexcept is Linux only, so floating point trapping does nothing on macOS
fp_trap = false
# STEPcode is not in Homebrew: built from subprojects/stepcode.wrap
step = 'enabled'
