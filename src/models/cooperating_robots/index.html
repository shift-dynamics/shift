<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js webgl - 7R Robot Arm Render</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../style/style.css">
    </head>

  <body>
    <div id="container">
    <div id="info">
      <a href="index.html">home</a>
    </div>
    <div id="inset">
    <script src="/build/jquery.min.js"></script>
    <script src="/build/three.js"></script>
    <script src="/js/controls/TrackballControls.js"></script>
    <script src="/js/loaders/MTLLoader.js"></script>
    <script src="/js/loaders/OBJLoader.js"></script>
    <script src="/js/loaders/OBJMTLLoader.js"></script>
    <script src="/js/Detector.js"></script>
    <script src="/js/libs/stats.min.js"></script>
    <script>

    //Uses jquery 2.0.3, downloaded from http://ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js
    if ( ! Detector.webgl ) Detector.addGetWebGLMessage();

    var container, stats, controls;
    var camera, scene, renderer, axes;
    var container2, camera2, scene2, renderer2, axes2;
    var CANVAS_WIDTH = 50, CANVAS_HEIGHT = 50, CAM_DISTANCE = 3;

    // var mouseX = 0, mouseY = 0;
    var windowHalfX = window.innerWidth / 2;
    var windowHalfY = window.innerHeight / 2;

    function init() {

        container = document.createElement( 'div' );
        document.body.appendChild( container );

        // create scene
        scene = new THREE.Scene();

        // set up camera
        camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 2000 );

        scene.add( camera );
        camera.position.set( 1, 1, 1 );
        camera.lookAt( scene.position );

        // set up lighting
        var ambient = new THREE.AmbientLight( 0x101030 );
        scene.add( ambient );

        var directionalLight = new THREE.DirectionalLight( 0xffeedd );
        directionalLight.position.set( 1, 1, 0 );
        scene.add( directionalLight );

        var directionalLight = new THREE.DirectionalLight( 0xffeedd );
        directionalLight.position.set( -1, -1, 0 );
        scene.add( directionalLight );

        // manager
        var manager = new THREE.LoadingManager();
        manager.onProgress = function ( item, loaded, total ) {
          console.log( item, loaded, total );
        };

        if (Detector.webgl)
          renderer = new THREE.WebGLRenderer( {antialias:true} );
        else
          renderer = new THREE.CanvasRenderer();

        renderer.setSize( window.innerWidth, window.innerHeight );
        container.appendChild( renderer.domElement );
        loaderObjMtl = new THREE.OBJMTLLoader( manager );
        loader_obj = new THREE.OBJLoader( manager );
        
        // Draw XZ grid
        var gridXZ = new THREE.GridHelper(2.5, 0.5);
        gridXZ.setColors( new THREE.Color(0x93a1a1), new THREE.Color(0x93a1a1) );
        gridXZ.position.set( 0,0,0 );
        scene.add( gridXZ );

        var planeGeometry = new THREE.Geometry();
        planeGeometry.vertices.push(new THREE.Vector3( -2.5, 0.0, 2.5));
        planeGeometry.vertices.push(new THREE.Vector3( 2.5, 0.0, 2.5));
        planeGeometry.vertices.push(new THREE.Vector3( 2.5, 0.0, -2.5));
        planeGeometry.vertices.push(new THREE.Vector3( -2.5, 0.0, -2.5));
        planeGeometry.faces.push(new THREE.Face3( 0, 1, 2 ));
        planeGeometry.faces.push(new THREE.Face3( 0, 2, 3 ));
        planeGeometry.faces[0].vertexColors[0] = new THREE.Color(0x073642);
        planeGeometry.faces[0].vertexColors[1] = new THREE.Color(0x073642);
        planeGeometry.faces[0].vertexColors[2] = new THREE.Color(0x073642);
        planeGeometry.faces[0].vertexColors[3] = new THREE.Color(0x073642);

        var planeMaterial = new THREE.MeshBasicMaterial({
          color:0x073642,
          vertexColors:THREE.VertexColors,
          side:THREE.DoubleSide
        });

        var planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
        planeMesh.position.set( 0.0, 0.0, 0.0 );
        scene.add( planeMesh );
        
        //axes = new THREE.AxisHelper();
        //scene.add(axes);

        // load robot arm MechON file
        //loadMechON( '/MechON/robot.json', loader );

    function loadMechON( file )
    {
        console.log( file );
        // var body_list = [];
        // var frame_list = [];
        var include_dir = '/static/robot/'

        for(var i = 0; i<file.bodyName.length; i++)
        {
            // assume initially that both obj and mtl files are available
            // need to add contingency if user provides only obj file or NO geometry definition
            // for no geometry, simply plot frames. 
            var obj_file = include_dir+file.bodyDef[i][0];
            console.log(obj_file);
            var mtl_file = include_dir+file.bodyDef[i][1];
            console.log(mtl_file);
            console.log(file.bodyOrientations[i]);

            var qx = file.bodyOrientations[i][1];
            var qy = file.bodyOrientations[i][2];
            var qz = file.bodyOrientations[i][3];
            var qw = file.bodyOrientations[i][0];
            var x = file.bodyOrientations[i][4];
            var y = file.bodyOrientations[i][5];
            var z = file.bodyOrientations[i][6];

            var loaderCallback = function( geometry )
            {
                geometry.quaternion.set( qx, qy, qz, qw );
                geometry.position.set( x, y, z );
                scene.add( geometry );
            };
            
            loaderObjMtl.load( obj_file, mtl_file, loaderCallback );
        }

    }

        //Load MechON File using jquery
        $.getJSON('response.json', {format: 'json'})
            .done( loadMechON )
            .fail( function(jqXHR, textStatus, errorThrown) {
                alert('Error: Could not load MechON file.');
            });

        // controls
        controls = new THREE.TrackballControls( camera, renderer.domElement );
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 0.2;
        controls.panSpeed = 0.8;
        controls.noZoom = false;
        controls.noPan = false;
        controls.keys = [ 65, 83, 68 ];
        controls.addEventListener( 'change', render );

        //Rendering statistics
        stats = new Stats();
        stats.domElement.style.position = 'absolute';
        stats.domElement.style.top = '0px';
        stats.domElement.style.zIndex = 100;
        container.appendChild( stats.domElement );

        // inset canvas
        // dom
        container2 = document.getElementById('inset');

        // renderer
        renderer2 = new THREE.CanvasRenderer();
        renderer2.setSize( CANVAS_WIDTH, CANVAS_HEIGHT );
        container2.appendChild( renderer2.domElement );

        // scene
        scene2 = new THREE.Scene();

        // camera
        camera2 = new THREE.PerspectiveCamera( 50, CANVAS_WIDTH / CANVAS_HEIGHT, 1, 1000 );
        camera2.up = camera.up; // important!
        scene2.add( camera2 );

        // axes
        axes2 = new THREE.AxisHelper( );
        scene2.add( axes2 );

        window.addEventListener( 'resize', onWindowResize, false );
      }

      function onWindowResize() {
        windowHalfX = window.innerWidth / 2;
        windowHalfY = window.innerHeight / 2;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize( window.innerWidth, window.innerHeight );
        render();
      }


      function animate() {
        requestAnimationFrame( animate );
        controls.update();

        var newPos = camera.position.clone();
        //newPos.subSelf(controls.target);
        newPos.setLength(CAM_DISTANCE);
        camera2.position.set(newPos.x, newPos.y, newPos.z);
        camera2.lookAt(new THREE.Vector3( 0.0, 0.0, 0.0 ));

        render();
      }


      function render() {
        //camera.position.x += ( mouseX - camera.position.x ) * .05;
        //camera.position.y += ( - mouseY - camera.position.y ) * .05;
        //camera.lookAt( scene.position );
        renderer.render( scene, camera );
        renderer2.render( scene2, camera2 );
        stats.update();
      }

      init();
      animate();
    </script>
    </body>
</html>
